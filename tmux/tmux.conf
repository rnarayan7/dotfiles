set -g prefix C-a
unbind C-b
bind C-a send-prefix

set-window-option -g window-style "bg=#082525"
set-window-option -g window-active-style "bg=#041616"

set-window-option -g window-status-current-style "bg=#041616,fg=white,bold"

set -g focus-events on

# Splits and new windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style "fg=white,bg=red,bold"

# Claude shortcut (prefix : cl)
set -s command-alias[100] 'cl=split-window -h -c "#{pane_current_path}" ; send-keys claude Enter'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save every 15 min, auto-restore on start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
