set -g prefix C-a
unbind C-b
bind C-a send-prefix

set-window-option -g window-style "bg=#082525"
set-window-option -g window-active-style "bg=#041616"

set-window-option -g window-status-current-style "bg=#041616,fg=white,bold"

set -g focus-events on

# Splits and new windows open in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set -g monitor-bell on
set -g bell-action any
set -g visual-bell off
set -g window-status-bell-style "fg=white,bg=red,bold"

# Window tree (prefix w): tmux's default format, plus the same red highlight on
# windows with a bell
bind w choose-tree -Zw -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_bell_flag,#[fg=white#,bg=red#,bold],}#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}}}'

# Claude shortcut (prefix : cl)
set -s command-alias[100] 'cl=split-window -h -c "#{pane_current_path}" ; send-keys claude Enter'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum: auto-save every 15 min, auto-restore on start
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep at bottom)
run '/opt/homebrew/opt/tpm/share/tpm/tpm'
